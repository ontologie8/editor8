name: Validate editor8
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/build_learning.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --check editor/app.js
      - run: node --check editor/interaction.js
      - run: node --check editor/learning/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg EDITOR8_COMMIT=${{ github.sha }} -t editor8:ci .
      - name: Health, static assets and protected API without embedded data
        run: |
          docker run -d --name editor8-smoke -p 127.0.0.1:18765:8080 \
            -e GITHUB_APP_CLIENT_ID=smoke-test \
            -e GITHUB_APP_CLIENT_SECRET=smoke-test \
            -e GITHUB_REPOSITORY=notariat8/ontology \
            -e PUBLIC_ORIGIN=https://editor.example.org \
            -e EDITOR_USERS=smoke-tester editor8:ci
          trap 'docker logs editor8-smoke; docker stop editor8-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18765/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/healthz
          curl --fail --silent http://127.0.0.1:18765/ > /dev/null
          curl --fail --silent http://127.0.0.1:18765/interaction.js > /dev/null
          for asset in editor/assets/brand/*.png; do
            curl --fail --silent "http://127.0.0.1:18765/${asset#editor/}" > /dev/null
          done
          for asset in editor/learning/*; do
            curl --fail --silent "http://127.0.0.1:18765/${asset#editor/}" > /dev/null
          done
          test "$(curl --fail --silent http://127.0.0.1:18765/api/release | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')" = "$GITHUB_SHA"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/status)" = 401
          docker exec editor8-smoke python -c "from pathlib import Path; assert not Path('/app/catalog').exists(); assert not Path('/app/cases').exists()"
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [software, container]
    runs-on: ubuntu-latest
    concurrency:
      group: editor8-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure using the main-branch identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Confirm the validated commit is still main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Build and publish the immutable image
        run: az acr build --registry acrnacontology8 --image "nac-editor:${GITHUB_SHA}" --build-arg "EDITOR8_COMMIT=${GITHUB_SHA}" --file Dockerfile .
      - name: Install Container Apps CLI
        run: az extension add --name containerapp --upgrade --yes
      - name: Deploy the validated commit
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          az containerapp update \
            --name ca-nac-ontology-editor \
            --resource-group rg-nac-ontology-editor \
            --image "acrnacontology8.azurecr.io/nac-editor:${GITHUB_SHA}" --output none
      - name: Check the active revision and delivered interface
        run: |
          set -euo pipefail
          expected="acrnacontology8.azurecr.io/nac-editor:${GITHUB_SHA}"
          base="https://www.ontologie8.de"
          local_hash=$(sha256sum editor/app.js | cut -d ' ' -f1)
          local_html_hash=$(sha256sum editor/index.html | cut -d ' ' -f1)
          local_css_hash=$(sha256sum editor/style.css | cut -d ' ' -f1)
          for attempt in $(seq 1 30); do
            live_image=$(az containerapp show --name ca-nac-ontology-editor --resource-group rg-nac-ontology-editor --query 'properties.template.containers[0].image' -o tsv)
            revision=$(az containerapp show --name ca-nac-ontology-editor --resource-group rg-nac-ontology-editor --query 'properties.latestReadyRevisionName' -o tsv)
            if [ "$live_image" = "$expected" ] && [ -n "$revision" ]; then
              ready_image=$(az containerapp revision show --name ca-nac-ontology-editor --resource-group rg-nac-ontology-editor --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
              health=$(az containerapp revision show --name ca-nac-ontology-editor --resource-group rg-nac-ontology-editor --revision "$revision" --query 'properties.healthState' -o tsv)
              active=$(az containerapp revision show --name ca-nac-ontology-editor --resource-group rg-nac-ontology-editor --revision "$revision" --query 'properties.active' -o tsv)
              if [ "$ready_image" = "$expected" ] && [ "$health" = Healthy ] && [ "$active" = true ]; then
                curl --fail --silent --show-error "$base/healthz" | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
                remote_hash=$(curl --fail --silent --show-error "$base/app.js" | sha256sum | cut -d ' ' -f1)
                test "$remote_hash" = "$local_hash"
                remote_html_hash=$(curl --fail --silent --show-error "$base/" | sha256sum | cut -d ' ' -f1)
                remote_css_hash=$(curl --fail --silent --show-error "$base/style.css" | sha256sum | cut -d ' ' -f1)
                test "$remote_html_hash" = "$local_html_hash"
                test "$remote_css_hash" = "$local_css_hash"
                for asset in editor/interaction.js editor/assets/brand/*.png editor/learning/*; do
                  expected_asset_hash=$(sha256sum "$asset" | cut -d ' ' -f1)
                  live_asset_hash=$(curl --fail --silent --show-error "$base/${asset#editor/}" | sha256sum | cut -d ' ' -f1)
                  test "$live_asset_hash" = "$expected_asset_hash"
                done
                release=$(curl --fail --silent --show-error "$base/api/release" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
                test "$release" = "$GITHUB_SHA"
                curl --fail --silent --show-error --dump-header - --output /dev/null "$base/login" | python -c 'import sys; from urllib.parse import urlparse,parse_qs; headers=sys.stdin.read().splitlines(); target=next(line.split(":",1)[1].strip() for line in headers if line.lower().startswith("location:")); assert parse_qs(urlparse(target).query)["redirect_uri"] == ["https://www.ontologie8.de/callback"]'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'The expected release did not become healthy' >&2
          exit 1
