name: Validate editor8
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --check editor/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t editor8:ci .
      - name: Health, static assets and protected API without embedded data
        run: |
          docker run --rm -d --name editor8-smoke -p 127.0.0.1:18765:8080 \
            -e GITHUB_APP_CLIENT_ID=smoke-test \
            -e GITHUB_APP_CLIENT_SECRET=smoke-test \
            -e GITHUB_REPOSITORY=example/dataset \
            -e PUBLIC_ORIGIN=https://editor.example.org \
            -e EDITOR_USERS=smoke-tester editor8:ci
          trap 'docker logs editor8-smoke; docker stop editor8-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18765/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/healthz
          curl --fail --silent http://127.0.0.1:18765/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/status)" = 401
          docker exec editor8-smoke python -c "from pathlib import Path; assert not Path('/app/catalog').exists(); assert not Path('/app/cases').exists()"
